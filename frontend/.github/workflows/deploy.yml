name: React CI/CD Pipeline

on:
  push:
    branches: [ main ]  # Triggers the workflow on pushes to the main branch
  pull_request:
    branches: [ main ]  # Triggers testing on pull requests to catch errors early

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Match your local development version
          cache: 'npm'     # Speeds up workflow by caching dependencies

      - name: Install Dependencies
        run: npm ci        # Ensures clean, predictable production builds

      - name: Run Tests
        run: npm test -- --watchAll=false # Runs tests once without hanging

      - name: Build Application
        run: npm run build

  deploy:
    needs: build-and-test # Ensures deployment only runs if testing succeeds
    if: github.ref == 'refs/heads/main' # Restricts deployment to the main branch only
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
